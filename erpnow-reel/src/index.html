<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ERPNow Reel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* preview player (hidden in capture mode) */
    #player { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999;
      display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-radius: 14px;
      background: rgba(20,20,24,.9); color: #fff; font: 600 14px Inter, sans-serif; }
    #player[hidden] { display: none; }
    #player button { font: inherit; color: #fff; background: #fe4d1e; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    #player input { width: 46vw; accent-color: #fe4d1e; }
    #player .t { width: 92px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs id="fx-defs"></defs></svg>
  <div id="viewport">
    <div id="world"><div id="scenes"></div></div>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="grain"></div>
  </div>
  <div id="player" hidden>
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="30" step="0.0333333" value="0">
    <span class="t" id="time">0.00s</span>
  </div>
  <audio id="audio" preload="auto"></audio>

  <script src="i18n.js"></script>
  <script src="engine.js"></script>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="scenes/01-hook.js"></script>
  <script src="scenes/02-brand.js"></script>
  <script src="scenes/03-sales.js"></script>
  <script src="scenes/04-inventory.js"></script>
  <script src="scenes/05-payments.js"></script>
  <script src="scenes/06-accounting.js"></script>
  <script src="scenes/07-dashboard.js"></script>
  <script src="scenes/08-approvals.js"></script>
  <script src="scenes/09-security.js"></script>
  <script src="scenes/10-stats.js"></script>
  <script src="scenes/11-cta.js"></script>
  <script src="main.js"></script>
</body>
</html>
